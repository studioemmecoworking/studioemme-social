name: Promemoria settimanale

# Ogni lunedì mattina: ti scrive su Telegram il materiale che serve nelle prossime
# settimane e ti conferma che l'automazione è viva.
on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

concurrency:
  group: studioemme-stato
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  promemoria:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Invia il promemoria
        run: python -m src.cli remind
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Salva lo stato
        run: |
          git config user.name "studioemme-bot"
          git config user.email "studioemme-bot@users.noreply.github.com"
          git add stato/
          if ! git diff --cached --quiet; then
            git commit -m "Aggiorna stato"
            git pull --rebase
            git push
          fi
